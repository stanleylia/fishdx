# .github/workflows/ci.yml — fishdx minimal CI 
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install fishdx (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check src/fishdx tests

      - name: Black formatting check
        run: black --check src/fishdx tests

      - name: Mypy strict typecheck
        run: mypy src/fishdx

      - name: Pytest (unit + integration markers)
        run: pytest -q

      - name: Frozen-config integrity
        run: |
          ACTUAL=$(sha256sum configs/default.yaml | awk '{print $1}')
          RECORDED=$(grep '^sha256:' configs/schema/frozen_config.lock | awk '{print $2}')
          [ "$ACTUAL" = "$RECORDED" ] || { echo "SHA drift: $ACTUAL vs $RECORDED"; exit 1; }
