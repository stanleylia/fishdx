# Paper reference: IEEE Access 2026, Liao et al., §IV.A Table 2.
# Binding doc: docs/m1/architecture-draft.md §3
#
# Role taxonomy (Skill S6 Pillar 2):
#   - train_eligible: allowed in TRAIN / SELECT phases
#   - test_only    : not used for parameter selection (within D1 split)
#   - held_out     : NEVER in TRAIN or SELECT (enforced by DatasetAccessGuard)
#   - kb_source    : used only for knowledge-base construction

datasets:
