# mypy.ini — supplementary settings (primary config in pyproject.toml [tool.mypy])
# This file exists to satisfy repository skeleton; see pyproject.toml for full settings.
[mypy]
python_version = 3.10
strict = True
disallow_untyped_defs = True
warn_unused_ignores = True
files = src/fishdx
exclude = (?x)(
    _legacy_multimodal_rag_
    | core/
    | proto/
    | services/
    | docs/archive/
  )

[mypy-open_clip.*]
ignore_missing_imports = True

[mypy-chromadb.*]
ignore_missing_imports = True

[mypy-sentence_transformers.*]
ignore_missing_imports = True
